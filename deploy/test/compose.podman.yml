name: gik-test

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: gik_postgres_test
    restart: unless-stopped
    env_file:
      - ./backend.env
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z
    networks:
      - gik-test

  minio:
    # Upstream Docker Hub / Quay community images are no longer public.
    # Verified multi-platform (including Raspberry Pi ARM64) on 2026-10-20.
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    container_name: gik_minio_test
    restart: unless-stopped
    env_file:
      - ./backend.env
    command: server /data --console-address ":9001"
    user: "65532:65532"
    volumes:
      - minio-data:/data:Z,U
    expose:
      - "9000"
      - "9001"
    networks:
      - gik-test
      - web

  minio-init:
    image: docker.io/library/python:3.13-alpine
    container_name: gik_minio_init_test
    env_file:
      - ./backend.env
    depends_on:
      - minio
    volumes:
      - ../../scripts/event-refresh:/bootstrap:ro,Z
    entrypoint: ["python", "/bootstrap/storage.py", "init"]
    networks:
      - gik-test

  backend:
    dns:
      - 1.1.1.1
    container_name: gik_backend_test
    build:
      context: ../..
      dockerfile: Containerfile
    image: localhost/gik-backend:test
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: 8080
    depends_on:
      - postgres
      - minio
    expose:
      - "8080"
    networks:
      - gik-test
      - web

volumes:
  postgres-data:
  minio-data:

networks:
  gik-test:
  web:
    external: true
